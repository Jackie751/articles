name: Build Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.json
        run: |
          python3 << 'PYEOF'
          import os, json, re

          FOLDERS = ['Opinion', 'Journal', 'Focus', 'Ideas']
          articles = []

          for folder in FOLDERS:
            if not os.path.isdir(folder):
              continue
            for fname in os.listdir(folder):
              if not fname.endswith('.md'):
                continue
              fpath = os.path.join(folder, fname)
              with open(fpath, encoding='utf-8') as f:
                content = f.read()

              fm = {}
              tags = []
              body = content
              m = re.match(r'^---\n(.*?)\n---\n', content, re.DOTALL)
              if m:
                fm_text = m.group(1)
                body = content[m.end():]
                lines = fm_text.split('\n')
                i = 0
                while i < len(lines):
                  line = lines[i]
                  # YAML 列表格式的 tags
                  if re.match(r'^tags\s*:\s*$', line):
                    i += 1
                    while i < len(lines) and lines[i].startswith('  - '):
                      tags.append(lines[i].replace('  - ', '').strip())
                      i += 1
                    continue
                  # 单行 tags
                  if re.match(r'^tags\s*:', line):
                    raw = line.split(':', 1)[1].strip()
                    raw = raw.replace('，', ' ').replace(',', ' ')
                    tags = [t.strip() for t in raw.split() if t.strip()]
                    i += 1
                    continue
                  if ':' in line and not line.startswith('  '):
                    k, v = line.split(':', 1)
                    fm[k.strip()] = v.strip()
                  i += 1

              if not fm.get('title'):
                continue

              excerpt = re.sub(r'^#+\s+.+$', '', body, flags=re.MULTILINE)
              excerpt = re.sub(r'[#*>`!\[\]()-]', '', excerpt)
              excerpt = ' '.join(excerpt.split())[:120] + '…'

              articles.append({
                'id': fname[:-3],
                'folder': folder,
                'title': fm.get('title', '').strip('"\''),
                'category': fm.get('category', folder).strip('"\''),
                'tags': tags,
                'date': fm.get('date', ''),
                'template': fm.get('template', 'default'),
                'excerpt': excerpt,
              })

          articles.sort(key=lambda x: x['date'], reverse=True)

          with open('index.json', 'w', encoding='utf-8') as f:
            json.dump(articles, f, ensure_ascii=False, indent=2)

          print(f'Generated index.json with {len(articles)} articles')
          PYEOF

      - name: Commit index.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "auto: update index.json"
          git push
